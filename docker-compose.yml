services:
  postgres:
    image: postgres:16-alpine
    container_name: cyberlab-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cyberlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyberlab_local_pg_2026}
      POSTGRES_DB: ${POSTGRES_DB:-cyberlab_db}
    volumes:
      - cyberlab_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyberlab} -d ${POSTGRES_DB:-cyberlab_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cyberlab-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-cyberlab}:${POSTGRES_PASSWORD:-cyberlab_local_pg_2026}@postgres:5432/${POSTGRES_DB:-cyberlab_db}
      SECRET_KEY: ${SECRET_KEY:-cyberlab_docker_dev_secret_key_change_in_prod_2026}
      AGENT_ENROLLMENT_KEY: ${AGENT_ENROLLMENT_KEY:-}
      SYSLOG_ENABLED: ${SYSLOG_ENABLED:-true}
      SYSLOG_PORT: ${SYSLOG_PORT:-5514}
      NETWORK_ENGINE_DRIVER: ${NETWORK_ENGINE_DRIVER:-simulation}
    ports:
      - "8000:8000"
      - "5514:5514/udp"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000/api/v1}
    container_name: cyberlab-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "3000:3000"

  # Multi-System Fleet Nodes (Live Containerized Endpoints reporting telemetry)
  corp-web-01:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: cyberlab-sys-web-01
    hostname: corp-web-01
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CYBERLAB_HOSTNAME: corp-web-01
      CYBERLAB_ENROLLMENT_KEY: ${AGENT_ENROLLMENT_KEY:-}
    command: ["python3", "/opt/cyberlab-agent/cyberlab_agent.py", "--server", "http://backend:8000", "--config", "/tmp/agent-web-01.json", "--interval", "10"]

  corp-db-01:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: cyberlab-sys-db-01
    hostname: corp-db-01
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CYBERLAB_HOSTNAME: corp-db-01
      CYBERLAB_ENROLLMENT_KEY: ${AGENT_ENROLLMENT_KEY:-}
    command: ["python3", "/opt/cyberlab-agent/cyberlab_agent.py", "--server", "http://backend:8000", "--config", "/tmp/agent-db-01.json", "--interval", "10"]

  finance-ws-01:
    build:
      context: ./agent
      dockerfile: Dockerfile
    container_name: cyberlab-sys-finance-01
    hostname: finance-ws-01
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      CYBERLAB_HOSTNAME: finance-ws-01
      CYBERLAB_ENROLLMENT_KEY: ${AGENT_ENROLLMENT_KEY:-}
    command: ["python3", "/opt/cyberlab-agent/cyberlab_agent.py", "--server", "http://backend:8000", "--config", "/tmp/agent-finance-01.json", "--interval", "10"]

  nginx:
    image: nginx:1.27-alpine
    container_name: cyberlab-nginx
    profiles: ["tls"]
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"

volumes:
  cyberlab_pgdata:
